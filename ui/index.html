<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Form UI</title>
    <link rel="stylesheet" href="layout.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">Practice UI</div>

        <nav class="menu">
            <a href="#">Home</a>
            <a href="#cards">Cards</a>
            <a href="#form">Form</a>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-content">
            <h1>Welcome to Our Portal</h1>
            <p>Experience fully customized inputs, animations and responsive design.</p>
        </div>

<div class="hero-img">
    <img src="https://cdn-icons-png.flaticon.com/512/2920/2920268.png" alt="Hero Image">
</div>
    </section>

    <!-- CARDS SECTION -->
    <section id="cards" class="cards-section">
        <h2>Our Topics</h2>

        <div class="cards">

            <div class="card">
                <img src="https://cdn-icons-png.flaticon.com/512/3306/3306610.png" alt="HTML">
                <p>HTML Basics</p>
            </div>

            <div class="card">
                <img src="https://cdn-icons-png.flaticon.com/512/919/919826.png" alt="CSS">
                <p>CSS Styling</p>
            </div>

            <div class="card">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968672.png" alt="Flexbox">
                <p>Flexbox</p>
            </div>

            <div class="card">
                <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png" alt="Grid">
                <p>Grid Layout</p>
            </div>

            <div class="card">
                <img src="https://cdn-icons-png.flaticon.com/512/2593/2593549.png" alt="Responsive">
                <p>Responsive UI</p>
            </div>

            <div class="card">
                <img src="https://cdn-icons-png.flaticon.com/512/4072/4072149.png" alt="Animation">
                <p>Animations</p>
            </div>

        </div>
    </section>

    <!-- FORM SECTION -->
    <section id="form" class="form-section">
        <h2>Registration Form</h2>

        <form>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter email">
            </div>

   
<!-- CUSTOM SELECT -->
<div class="form-group">
    <label>Select Country</label>

    <label class="custom-select">
        <input type="checkbox" class="select-toggle">

        <span class="selected">
            Choose country
            <span class="select-icon">▾</span>
        </span>

        <div class="options">
            <div class="option">India</div>
            <div class="option">USA</div>
            <div class="option">Canada</div>
            <div class="option">Australia</div>
        </div>
    </label>
</div>

            <!-- CUSTOM RADIO -->
            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <label class="custom-radio">
                        <input type="radio" name="gender">
                        <span class="radio-mark"></span> Male
                    </label>

                    <label class="custom-radio">
                        <input type="radio" name="gender">
                        <span class="radio-mark"></span> Female
                    </label>
                </div>
            </div>

            <!-- CUSTOM CHECKBOX -->
            <div class="form-group">
                <label>Hobbies</label>
                <div class="checkbox-group">
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="check-mark"></span> Reading
                    </label>

                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="check-mark"></span> Travelling
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Upload Resume</label>
                <input type="file">
            </div>

            <button class="submit-btn">Submit</button>

        </form>
    </section>

<script src="script.js"></script>
</body>
</html>
